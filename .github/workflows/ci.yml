name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # tipos + ESLint + Vitest + contraste dos tokens + fronteira dos mocks
      - name: Verificações (npm run check)
        run: npm run check

      # O mesmo build que vai para a VPS (mocks ligados).
      - name: Build demo
        run: npm run build:demo
