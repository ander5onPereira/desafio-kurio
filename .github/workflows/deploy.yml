name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SERVER_USER: root
  SERVER_HOST: 72.60.56.27
  PROJECT_PATH: kurio

jobs:
  validate:
    name: Validar
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "SSH_PRIVATE_KEY inválida"; exit 1; }
          printf 'Host *\n  IdentitiesOnly yes\n  IdentityFile ~/.ssh/id_ed25519\n' > ~/.ssh/config
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      # Só o necessário para o build da imagem (Dockerfile) vai para o servidor.
      - name: Rsync para o servidor
        run: |
          rsync -azv --delete \
            --exclude node_modules \
            --exclude dist \
            --exclude .git \
            --exclude .github \
            --exclude .env \
            --exclude .env.local \
            --exclude "deploy_key*" \
            --exclude e2e \
            --exclude docs \
            --exclude design \
            --exclude Desktop \
            --exclude reports \
            --exclude test-results \
            --exclude playwright-report \
            ./ "$SERVER_USER@$SERVER_HOST:$PROJECT_PATH/"

      - name: Build e subir container
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" \
            "cd $PROJECT_PATH && docker compose up -d --build && docker image prune -f"

      - name: Verificar saúde do container
        run: |
          for i in 1 2 3 4 5 6; do
            status=$(ssh "$SERVER_USER@$SERVER_HOST" "docker inspect -f '{{.State.Health.Status}}' kurio" || true)
            echo "healthcheck: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 10
          done
          echo "Container não ficou saudável"; exit 1
