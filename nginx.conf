server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript text/javascript application/json image/svg+xml;

    # Obs.: add_header em um location SUBSTITUI os do nível superior, então os
    # cabeçalhos de segurança são repetidos em cada location.

    # Verificação de saúde (healthcheck do compose).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Service Worker do MSW (o "servidor" da demo): nunca pode ficar em cache,
    # senão uma versão antiga do worker continua interceptando as chamadas.
    location = /mockServiceWorker.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Arquivos com hash no nome (Vite): cache longo.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Artes (AVIF/WebP) sem hash no nome: cache de 1 dia, sem fallback para o index.html.
    location /img/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Rotas do React (/carrinho, /pagamento, /nft/...): sempre devolve o index.html, sem cache.
    # Acesso direto e refresh das rotas funcionam por causa do try_files.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
